name: Test SDK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  portable-proof-write:
    name: Portable proof write (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Write and verify a normal in-workspace proof
        run: node --test --test-name-pattern "writes and independently verifies" integrations/github-action/gate.test.mjs

  sdk-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node: "18"
            python: "3.10"
          - node: "24"
            python: "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}

      - name: Verify release metadata consistency
        run: node scripts/check-release-consistency.mjs

      - name: Release and action boundary tests
        run: |
          node --test scripts/check-release-consistency.test.mjs
          node --test integrations/github-action/gate.test.mjs

      - name: Node SDK tests
        working-directory: sdk/node
        run: |
          npm ci
          npm test

      - name: GitHub Actions adapter allows satisfied policy
        id: vella_allowed
        uses: ./integrations/github-action
        with:
          intent: EXECUTE_CHANGE
          evidence-mask: "1"

      - name: Verify adapter allow path emitted ALLOWED
        if: steps.vella_allowed.outputs.decision != 'ALLOWED'
        run: |
          echo "Expected the VELLA authority gate to emit ALLOWED"
          exit 1

      - name: GitHub Actions adapter denies missing evidence
        id: vella_denied
        continue-on-error: true
        uses: ./integrations/github-action
        with:
          intent: ESCALATE_PRIVILEGE
          evidence-mask: "1"

      - name: Verify adapter deny path failed closed
        if: steps.vella_denied.outcome != 'failure' || steps.vella_denied.outputs.decision != 'DENIED'
        run: |
          echo "Expected the VELLA authority gate to emit DENIED and fail the step"
          exit 1

      - name: Load proof-signing test fixture
        id: vella_test_key
        shell: bash
        run: |
          {
            echo 'private-key<<VELLA_TEST_KEY_EOF'
            cat sdk/node/test/fixtures/test-signing-private.pem
            echo 'VELLA_TEST_KEY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: GitHub Actions adapter emits a signed proof
        id: vella_signed
        uses: ./integrations/github-action
        with:
          intent: EXECUTE_CHANGE
          evidence-mask: "1"
          proof-signing-key: ${{ steps.vella_test_key.outputs.private-key }}
          proof-output: artifacts/ci-vella-proof.json

      - name: Verify the adapter proof independently
        run: |
          test -f "${{ steps.vella_signed.outputs['proof-path'] }}"
          node verify/verify.js \
            "${{ steps.vella_signed.outputs['proof-path'] }}" \
            sdk/node/test/fixtures/test-signing-public.pem

      - name: GitHub Actions adapter rejects an invalid signing key
        id: vella_invalid_key
        continue-on-error: true
        uses: ./integrations/github-action
        with:
          intent: EXECUTE_CHANGE
          evidence-mask: "1"
          proof-signing-key: not-a-private-key
          proof-output: artifacts/invalid-key-proof.json

      - name: Verify invalid signing key failed closed
        if: steps.vella_invalid_key.outcome != 'failure' || steps.vella_invalid_key.outputs.decision != ''
        run: |
          echo "Expected invalid proof signing to fail without emitting a decision"
          exit 1

      - name: GitHub Actions adapter rejects a proof path outside the workspace
        id: vella_invalid_path
        continue-on-error: true
        uses: ./integrations/github-action
        with:
          intent: EXECUTE_CHANGE
          evidence-mask: "1"
          proof-signing-key: ${{ steps.vella_test_key.outputs.private-key }}
          proof-output: ../vella-proof-outside-workspace.json

      - name: Verify invalid proof path failed closed
        if: steps.vella_invalid_path.outcome != 'failure' || steps.vella_invalid_path.outputs.decision != ''
        run: |
          echo "Expected the invalid proof path to fail without emitting a decision"
          exit 1

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}

      - name: Python SDK tests
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest

      - name: Python lint and typing
        working-directory: sdk/python
        run: |
          ruff check .
          mypy --strict vella/

      - name: Production proof producer and verifier conformance
        run: node --test scripts/proof-conformance.test.mjs

  mcp-reference:
    name: Local MCP (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install local reference dependencies
        run: |
          python -m pip install -e sdk/python setuptools wheel
          npm ci --ignore-scripts --prefix integrations/mcp-experiment
          npm ci --ignore-scripts --prefix integrations/mcp-server
      - name: Client and server comparison
        working-directory: integrations/mcp-experiment
        run: |
          npm test
          npm run demo
      - name: Governed server and public types
        working-directory: integrations/mcp-server
        run: |
          npm test
          npm run typecheck
          npm run demo
      - name: Concurrent operational and recovery smoke checks
        run: node integrations/mcp-server/operational/run.mjs --smoke --output "$RUNNER_TEMP/operational-smoke.json"
      - name: Upload operational smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operational-${{ matrix.os }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/operational-smoke.json
      - name: Clean candidate package installation
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: node scripts/check-package-install.mjs
      - name: Fetch immutable rollback baseline
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: git fetch --depth=1 origin cbafda49ddb1682832b438498437d62de4f84d95
      - name: Installed producer migration and retained-proof rollback rehearsal
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: node scripts/check-migration.mjs
