name: Publish SDKs

# Triggers on a published GitHub Release. Tag the release `vX.Y.Z` and the
# version across packages, citation metadata, and changelog must match. Both jobs use OIDC
# Trusted Publisher flows; no long-lived secrets in the repo.
#
# One-time setup (already done; documented here for the audit trail):
#   npm:  Settings → Trusted publishers → Add (repo: vellacognitive/vella-substrate,
#         workflow: publish.yml, environment: release).
#   PyPI: Project → Publishing → Trusted publishers → Add pending publisher
#         (same triple) before the project exists; PyPI promotes it on first
#         publish.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to verify (must match every release surface, e.g. v1.0.3)"
        required: true
      registry:
        description: "Registry publish target"
        required: true
        default: both
        type: choice
        options:
          - both
          - npm
          - pypi

permissions:
  contents: read

jobs:
  verify-versions:
    name: Verify tag matches package versions
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      RELEASE_EVENT_SHA: ${{ github.event_name == 'release' && github.sha || '' }}
    outputs:
      version: ${{ steps.derive.outputs.version }}
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.derive.outputs.tag }}
    steps:
      - name: Validate release tag
        id: derive
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must use stable vMAJOR.MINOR.PATCH syntax" >&2
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Validated tag $RELEASE_TAG with expected version $VERSION"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ steps.derive.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind release to checked-out commit
        id: source
        shell: bash
        run: |
          TAG_COMMIT="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          HEAD_COMMIT="$(git rev-parse --verify HEAD)"
          if [[ "$TAG_COMMIT" != "$HEAD_COMMIT" ]]; then
            echo "Release tag resolves to $TAG_COMMIT, but checkout is $HEAD_COMMIT" >&2
            exit 1
          fi
          if [[ -n "$RELEASE_EVENT_SHA" ]]; then
            if [[ ! "$RELEASE_EVENT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "Release event did not provide a full commit SHA" >&2
              exit 1
            fi
            EVENT_COMMIT="$(git rev-parse --verify "${RELEASE_EVENT_SHA}^{commit}")"
            if [[ "$TAG_COMMIT" != "$EVENT_COMMIT" ]]; then
              echo "Release tag resolves to $TAG_COMMIT, but the release event identifies $EVENT_COMMIT" >&2
              exit 1
            fi
          fi
          echo "sha=$TAG_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Bound $RELEASE_TAG to $TAG_COMMIT"

      - name: Verify all release surfaces
        run: |
          CHECK_ARGS=(
            --tag "$RELEASE_TAG"
            --require-released
            --require-tagged-head
          )
          if [[ -n "$RELEASE_EVENT_SHA" ]]; then
            CHECK_ARGS+=(--expected-commit "$RELEASE_EVENT_SHA")
          fi
          node scripts/check-release-consistency.mjs "${CHECK_ARGS[@]}"

  publish-node:
    name: Publish @vellacognitive/vella-sdk to npm
    needs: verify-versions
    if: github.event_name == 'release' || inputs.registry == 'both' || inputs.registry == 'npm'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-versions.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Publish (Trusted Publisher OIDC + provenance)
        run: npm publish --provenance --access public

  publish-python:
    name: Publish vella-sdk to PyPI
    needs: verify-versions
    if: github.event_name == 'release' || inputs.registry == 'both' || inputs.registry == 'pypi'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-versions.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build sdist + wheel
        working-directory: sdk/python
        run: python -m build

      - name: Run tests against built wheel
        working-directory: sdk/python
        run: |
          python -m pip install dist/*.whl
          python -m pip install pytest cryptography
          pytest -q

      - name: Publish to PyPI (Trusted Publisher / OIDC)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: sdk/python/dist/
